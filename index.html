<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maize Defense</title>
<meta name="description" content="Fence in a hungry pig so its walk to your corn crib is as long as possible.">
<meta name="theme-color" content="#2F6B1F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap">
</head>
<body>

<main class="app">
  <header>
    <h1>Maize <span>Defense</span></h1>
    <button class="btn small" id="fieldsBtn" type="button" aria-expanded="false" aria-controls="fields">Field 1</button>
  </header>

  <section class="fields" id="fields" hidden aria-label="Choose a field"></section>

  <div class="stats">
    <div class="stat"><span class="k">Fences left</span><span class="v" id="sFences">0</span></div>
    <div class="stat"><span class="k" id="kWalk">Pig's walk</span><span class="v" id="sWalk">0</span></div>
    <div class="stat"><span class="k" id="kThird">Your best</span><span class="v" id="sTime">—</span></div>
  </div>

  <div class="boardwrap" id="boardwrap">
    <canvas id="board" role="img" aria-label="Field grid. Tap squares to place or remove fences."></canvas>
  </div>

  <div class="legend" id="legend" hidden></div>

  <p class="msg" id="msg" aria-live="polite"></p>

  <div class="controls">
    <button class="btn" id="b1" type="button">Clear</button>
    <button class="btn primary" id="b3" type="button">Release the pig</button>
  </div>
</main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
